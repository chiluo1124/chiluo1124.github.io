<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>诸神愚戏 · 信仰游戏</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0812; --card:#181530; --card2:#201b3d;
  --gold:#d4af37; --gold2:#f5d76e; --blood:#c0392b;
  --text:#e8e4d8; --dim:#8a86a3;
  --civil:#d4af37; --life:#4caf7d; --sink:#9b59b6;
  --chaos:#e74c3c; --void:#b8b8d1; --exist:#5dade2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse at 20% -5%, rgba(90,60,160,.28), transparent 55%),
    radial-gradient(ellipse at 85% 105%, rgba(160,60,90,.20), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;
  font-size:16px; height:100dvh; overflow:hidden;
}
::-webkit-scrollbar{width:0;height:0}
.view{display:none;height:100%}
.view.active{display:flex;flex-direction:column}
.wrap{flex:1;overflow-y:auto;padding:16px}
.card{background:var(--card);border:1px solid rgba(212,175,55,.22);border-radius:14px;padding:16px;margin-bottom:12px}
input,textarea{width:100%;background:var(--card);border:1px solid rgba(212,175,55,.3);color:var(--text);padding:11px 12px;border-radius:9px;font-family:inherit;font-size:15px}
textarea{resize:none;line-height:1.6}
.btn{display:block;width:100%;background:linear-gradient(135deg,#8a6d1f,#d4af37);color:#1a1408;border:none;padding:12px;border-radius:9px;font-family:inherit;font-size:16px;font-weight:bold;margin-top:10px;letter-spacing:2px}
.btn.ghost{background:transparent;border:1px solid rgba(212,175,55,.45);color:var(--gold)}
.btn.blood{background:linear-gradient(135deg,#6e1f1f,#c0392b);color:#ffe}
.btn.sm{width:auto;display:inline-block;padding:8px 16px;margin:0;font-size:14px;letter-spacing:0}
.btn:disabled{opacity:.4}
.dim{color:var(--dim);font-size:13px}
.err{color:#e74c3c;font-size:13px;margin-top:8px;min-height:18px}

/* ---------- 登录 ---------- */
#view-auth{align-items:center;justify-content:center;padding:24px;text-align:center}
.eye{font-size:46px;color:var(--gold);text-shadow:0 0 24px rgba(212,175,55,.8);margin-bottom:8px;animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.75}50%{opacity:1}}
.game-title{font-size:38px;letter-spacing:10px;color:var(--gold2);text-shadow:0 0 26px rgba(212,175,55,.55)}
.subtitle{letter-spacing:6px;color:var(--dim);margin:8px 0 26px;font-size:14px}
#view-auth .card{width:100%;max-width:380px;text-align:left}
.tip{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.7}

/* ---------- 答题 ---------- */
#quiz-progress{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:14px}
#quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,#8a6d1f,var(--gold2));transition:width .3s}
#quiz-num{text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:10px}
#quiz-q{background:var(--card);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:18px;font-size:17px;line-height:1.7;margin-bottom:14px;letter-spacing:1px}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);border-radius:11px;padding:13px 14px;margin-bottom:9px;font-family:inherit;font-size:15px;line-height:1.5;cursor:pointer}
.quiz-opt:active{border-color:var(--gold)}
.quiz-opt.sel{border-color:var(--gold);background:linear-gradient(135deg,#3a2f14,#2a2210);color:var(--gold2)}

/* ---------- 浮空卡牌 ---------- */
#view-cards{align-items:flex-start;justify-content:center;padding:10px 20px;overflow-y:auto}
.deck-title{color:var(--gold2);font-size:20px;letter-spacing:4px;margin-top:4px;text-align:center}
.deck-sub{color:var(--dim);font-size:13px;margin:6px 0 12px;letter-spacing:1px;text-align:center}
#deck-box{position:relative;width:min(78vw,290px);height:min(56vh,350px);margin:4px auto 0}
.gcard{position:absolute;inset:0;border-radius:18px;padding:22px 18px;
  background:linear-gradient(160deg,#221c44,#14102a 70%);
  border:1px solid rgba(212,175,55,.35);
  box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(212,175,55,.12);
  display:flex;flex-direction:column;transition:transform .25s,opacity .25s;user-select:none}
.gcard.top{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{margin-top:0}50%{margin-top:-9px}}
.gcard .gc-path{font-size:12px;letter-spacing:3px;color:var(--dim)}
.gcard .gc-name{font-size:34px;letter-spacing:6px;margin:10px 0 4px;color:var(--gold2);text-shadow:0 0 18px rgba(212,175,55,.5)}
.gcard .gc-rank{align-self:flex-start;border:1px solid var(--gold);color:var(--gold2);border-radius:5px;padding:2px 9px;font-size:13px;margin-bottom:12px}
.gcard .gc-rank.ss{background:linear-gradient(135deg,#7a1f1f,#c0392b);color:#fff;border-color:#e74c3c}
.gcard .gc-desc{flex:1;font-size:13.5px;line-height:1.8;color:var(--text);opacity:.92;overflow:hidden}
.gcard .gc-quote{font-size:11.5px;color:var(--dim);margin-top:10px;font-style:italic}
#deck-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px auto 20px;width:100%;max-width:340px}
.nav-arrow{width:46px;height:46px;border-radius:50%;background:var(--card2);border:1px solid rgba(212,175,55,.4);color:var(--gold);font-size:19px;font-family:inherit;flex:none}
#deck-confirm{flex:1}

/* ---------- 步骤页（命名/职业） ---------- */
.step-title{font-size:20px;color:var(--gold2);letter-spacing:3px;margin-bottom:4px}
.step-sub{font-size:13px;color:var(--dim);margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px;color:var(--text);font-family:inherit;cursor:pointer}
.opt .t{font-size:17px;font-weight:bold;letter-spacing:2px}
.opt .d{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.6}
.opt:active{transform:scale(.98)}

/* ---------- 主框架 ---------- */
#app-header{padding:12px 16px;border-bottom:1px solid rgba(212,175,55,.25);display:flex;justify-content:space-between;align-items:center;background:rgba(10,8,18,.9)}
#app-header .t{color:var(--gold2);font-size:17px;letter-spacing:2px}
#app-header .s{font-size:12px;color:var(--dim);margin-top:2px}
.tab{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab.active{display:flex}
#tabbar{display:flex;border-top:1px solid rgba(212,175,55,.25);background:rgba(10,8,18,.96);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-btn{flex:1;padding:9px 0 11px;text-align:center;color:var(--dim);font-size:12px;background:none;border:none;font-family:inherit;cursor:pointer}
.tabbar-btn .ic{display:block;font-size:19px;margin-bottom:2px}
.tabbar-btn.on{color:var(--gold2)}

/* ---------- 频道（聊天+论坛） ---------- */
.chan-btns{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto}
.chan-btn{flex:1;min-width:60px;padding:8px 4px;background:var(--card);border:1px solid rgba(212,175,55,.2);color:var(--dim);border-radius:8px;font-family:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chan-btn.on{color:var(--gold2);border-color:var(--gold);background:var(--card2)}
#msg-list{flex:1;overflow-y:auto;padding:14px 12px}
.msg{margin-bottom:14px}
.msg .who{font-size:12px;color:var(--dim);margin-bottom:4px}
.msg .who .god{color:var(--gold);margin-right:6px}
.msg .bub{display:inline-block;max-width:82%;padding:9px 13px;border-radius:12px;background:var(--card2);border:1px solid rgba(255,255,255,.08);line-height:1.55;word-break:break-word;text-align:left}
.msg.me{text-align:right}
.msg.me .bub{background:linear-gradient(135deg,#3a2f14,#2a2210);border-color:rgba(212,175,55,.5);color:var(--gold2)}
.msg .time{font-size:11px;color:var(--dim);margin-top:3px}
.input-bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(212,175,55,.2);background:rgba(10,8,18,.92)}
.input-bar input{flex:1}
#post-list{flex:1;overflow-y:auto;padding:14px 12px}
.post-card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.post-card .pt{font-size:16px;font-weight:bold;color:var(--gold2);letter-spacing:1px}
.post-card .pp{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post-card .pm{font-size:12px;color:var(--dim);margin-top:8px}
#btn-new{position:absolute;right:16px;bottom:70px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8a6d1f,#d4af37);color:#1a1408;border:none;font-size:26px;font-family:inherit;box-shadow:0 4px 16px rgba(212,175,55,.4);z-index:5}
.f-sub{display:none;flex:1;flex-direction:column;overflow:hidden}
.f-sub.active{display:flex}
.f-scroll{flex:1;overflow-y:auto;padding:14px 12px}
.cmt{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.cmt .cm{font-size:11px;color:var(--dim);margin-top:4px}

/* ---------- 试炼 ---------- */
.trial{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px;margin-bottom:10px}
.trial .tn{font-size:15px}
.trial .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:9px;overflow:hidden}
.trial .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d1f,var(--gold2))}
.trial .tp{font-size:11px;color:var(--dim);margin-top:5px}

/* ---------- 面板 ---------- */
.p-name{font-size:26px;color:var(--gold2);letter-spacing:3px;text-align:center}
.p-tags{text-align:center;margin:8px 0 16px;font-size:13px}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:3px 12px;margin:0 4px;font-size:13px}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.score-card{background:var(--card);border:1px solid rgba(212,175,55,.25);border-radius:12px;padding:14px;text-align:center}
.score-card .n{font-size:22px;color:var(--gold2);font-weight:bold;margin-top:4px}
.score-card .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:9px;overflow:hidden}
.score-card .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d1f,var(--gold2))}
.sec-t{font-size:15px;color:var(--gold);letter-spacing:3px;margin:18px 0 10px;border-left:3px solid var(--gold);padding-left:8px}
.talent{background:var(--card);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:9px}
.talent .tt{font-size:15px;font-weight:bold}
.talent .td{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6}
.rank{display:inline-block;min-width:24px;text-align:center;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:bold;background:#3a2f14;color:var(--gold2);border:1px solid var(--gold)}
.rank.ss{background:linear-gradient(135deg,#7a1f1f,#c0392b);color:#fff;border-color:#e74c3c}
.item-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:10px 12px;margin-bottom:7px;font-size:14px;gap:8px}
.item-row .cnt{color:var(--gold2);font-weight:bold}
.skill-chips{display:flex;flex-wrap:wrap;gap:7px}
.skill-chips span{border:1px solid rgba(93,173,226,.4);color:var(--exist);border-radius:16px;padding:4px 12px;font-size:13px}
.rank-row{display:flex;justify-content:space-between;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:10px 12px;margin-bottom:5px;font-size:14px}
.rank-row.first{border-color:var(--gold);color:var(--gold2)}
.rank-row.mine{background:linear-gradient(135deg,#3a2f14,#2a2210);border-color:rgba(212,175,55,.5)}

/* ---------- 我的 ---------- */
.me-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:13px 14px;margin-bottom:9px;font-size:15px;gap:10px}
.me-row button{background:none;border:1px solid rgba(212,175,55,.4);color:var(--gold);border-radius:7px;padding:6px 13px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(20,16,40,.96);border:1px solid var(--gold);color:var(--gold2);padding:13px 24px;border-radius:10px;font-size:15px;letter-spacing:1px;display:none;z-index:99;max-width:82%;text-align:center}
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div class="view" id="view-auth">
  <div class="eye">◉</div>
  <div class="game-title">诸神愚戏</div>
  <div class="subtitle">信 仰 游 戏 · FAITH GAME</div>
  <div class="card">
    <div style="letter-spacing:2px;margin-bottom:10px;color:var(--gold)">踏入命途</div>
    <input id="uid" placeholder="代号（字母或数字，3~16位）" autocomplete="off" maxlength="16">
    <input id="pass" type="password" placeholder="密码（至少6位）" style="margin-top:8px">
    <button class="btn" onclick="doLogin()">登 录</button>
    <button class="btn ghost" onclick="doRegister()">注册新信徒</button>
    <div class="err" id="authErr"></div>
  </div>
  <div class="tip">诸神已降临，世界被改造为一场荒诞的信仰游戏。<br>无需邮箱，一个代号即可踏入命途。</div>
</div>

<!-- ================= 新手试炼：答题 ================= -->
<div class="view" id="view-quiz">
  <div class="wrap" style="max-width:520px;width:100%;margin:0 auto">
    <div style="text-align:center;color:var(--gold2);letter-spacing:4px;margin-bottom:14px">✦ 命 途 叩 问 ✦</div>
    <div id="quiz-num">第 1 / 30 问</div>
    <div id="quiz-progress"><i style="width:3%"></i></div>
    <div id="quiz-q"></div>
    <div id="quiz-opts"></div>
    <div class="dim" style="text-align:center;margin-top:12px;font-size:12px">凭本能作答，诸神在注视你</div>
  </div>
</div>

<!-- ================= 浮空卡牌：选择神明 ================= -->
<div class="view" id="view-cards">
  <div class="deck-title">✦ 诸 神 回 应 了 你 ✦</div>
  <div class="deck-sub">左右滑动卡牌，聆听祂们的低语，选择你的信仰</div>
  <div id="deck-box"></div>
  <div id="deck-ctrl">
    <button class="nav-arrow" onclick="deckNav(-1)">‹</button>
    <button class="btn" id="deck-confirm" onclick="confirmGod()">信 奉 此 神</button>
    <button class="nav-arrow" onclick="deckNav(1)">›</button>
  </div>
</div>

<!-- ================= 命名 ================= -->
<div class="view" id="view-name">
  <div class="wrap" style="max-width:420px;width:100%;margin:0 auto">
    <div class="step-title">为信徒命名</div>
    <div class="step-sub" id="name-sub"></div>
    <div class="card">
      <input id="pname" maxlength="12" placeholder="你的名字（12字以内，以后可改）">
      <button class="btn" onclick="goJob()">继 续</button>
    </div>
  </div>
</div>

<!-- ================= 选择职业 ================= -->
<div class="view" id="view-job">
  <div class="wrap" style="max-width:520px;width:100%;margin:0 auto">
    <div class="step-title">选择你的职业</div>
    <div class="step-sub">职业只有六种。没有菜的玩家，只有菜的……咳，天赋很重要。</div>
    <div id="job-opts"></div>
  </div>
</div>

<!-- ================= 主应用 ================= -->
<div class="view" id="view-app">
  <div id="app-header">
    <div>
      <div class="t" id="h-name">无名信徒</div>
      <div class="s" id="h-faith"></div>
    </div>
    <div style="font-size:22px;color:var(--gold)">✦</div>
  </div>

  <!-- 频道：聊天五频道+论坛 -->
  <div class="tab active" id="tab-chat" style="position:relative">
    <div class="chan-btns" id="chan-btns"></div>
    <div id="chat-pane" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div id="msg-list"></div>
      <div class="input-bar" id="chat-inputbar">
        <input id="msg-input" placeholder="向众生诉说……" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn sm" onclick="sendMsg()">发送</button>
      </div>
    </div>
    <div id="forum-pane" style="flex:1;display:none;flex-direction:column;overflow:hidden;position:relative">
      <div class="f-sub active" id="forum-list-wrap">
        <div id="post-list"></div>
        <button id="btn-new" onclick="forumShow('forum-new')">✎</button>
      </div>
      <div class="f-sub" id="forum-new">
        <div class="f-scroll">
          <div class="card">
            <div style="color:var(--gold);letter-spacing:2px;margin-bottom:10px">发 帖</div>
            <input id="post-title" maxlength="40" placeholder="标题（如：血与火之歌试炼攻略）">
            <textarea id="post-content" rows="8" placeholder="内容……" style="margin-top:8px"></textarea>
            <button class="btn" onclick="sendPost()">发 布</button>
            <button class="btn ghost" onclick="forumShow('forum-list-wrap')">取 消</button>
          </div>
        </div>
      </div>
      <div class="f-sub" id="forum-detail">
        <div class="f-scroll" id="detail-body"></div>
        <div class="input-bar">
          <input id="cmt-input" placeholder="写下你的回复……" onkeydown="if(event.key==='Enter')sendCmt()">
          <button class="btn sm" onclick="sendCmt()">回复</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 试炼 -->
  <div class="tab" id="tab-trials"><div class="wrap" id="trials-body"></div></div>

  <!-- 面板 -->
  <div class="tab" id="tab-panel"><div class="wrap" id="panel-body"></div></div>

  <!-- 背包 -->
  <div class="tab" id="tab-bag"><div class="wrap" id="bag-body"></div></div>

  <!-- 好友 -->
  <div class="tab" id="tab-friends">
    <div id="friends-main" style="flex:1;overflow-y:auto">
      <div class="wrap" id="friends-body"></div>
    </div>
    <div id="dm-pane" style="display:none;flex:1;flex-direction:column;overflow:hidden">
      <div id="dm-head" style="padding:10px 14px;border-bottom:1px solid rgba(212,175,55,.2);display:flex;align-items:center;gap:10px"></div>
      <div id="dm-list" style="flex:1;overflow-y:auto;padding:12px"></div>
      <div class="input-bar">
        <input id="dm-input" placeholder="私语……" onkeydown="if(event.key==='Enter')sendDM()">
        <button class="btn sm" onclick="sendDM()">发送</button>
      </div>
    </div>
  </div>

  <!-- 我的 -->
  <div class="tab" id="tab-me"><div class="wrap" id="me-body"></div></div>

  <div id="tabbar">
    <button class="tabbar-btn on" data-t="tab-chat" onclick="showTab('tab-chat',this)"><span class="ic">✦</span>频道</button>
    <button class="tabbar-btn" data-t="tab-trials" onclick="showTab('tab-trials',this)"><span class="ic">⚔</span>试炼</button>
    <button class="tabbar-btn" data-t="tab-panel" onclick="showTab('tab-panel',this)"><span class="ic">❖</span>面板</button>
    <button class="tabbar-btn" data-t="tab-bag" onclick="showTab('tab-bag',this)"><span class="ic">▣</span>背包</button>
    <button class="tabbar-btn" data-t="tab-friends" onclick="showTab('tab-friends',this)"><span class="ic">♦</span>好友</button>
    <button class="tabbar-btn" data-t="tab-me" onclick="showTab('tab-me',this)"><span class="ic">⚙</span>我的</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 命途叩问题库（100道，随机抽30道） =================
   每题4个选项，每个选项给1~2位神明加倾向分。
   想扩充题库：照格式往数组里加即可。 */

function startQuiz(){
  quizQs=shuffle([...QUIZ_BANK]).slice(0,30);
  quizIdx=0; quizScores={};
  show('view-quiz'); renderQuiz();
}
function renderQuiz(){
  const q=quizQs[quizIdx];
  $('quiz-num').textContent=`第 ${quizIdx+1} / 30 问`;
  $('quiz-progress').firstElementChild.style.width=((quizIdx+1)/30*100)+'%';
  $('quiz-q').textContent=q[0];
  $('quiz-opts').innerHTML='';
  q.slice(1).forEach(opt=>{
    const b=document.createElement('button');
    b.className='quiz-opt'; b.textContent=opt[0];
    b.onclick=()=>{
      $('quiz-opts').querySelectorAll('.quiz-opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      for(const g in opt[1]) quizScores[g]=(quizScores[g]||0)+opt[1][g];
      setTimeout(()=>{ quizIdx++; quizIdx<30 ? renderQuiz() : calcGods(); }, 260);
    };
    $('quiz-opts').appendChild(b);
  });
}
function calcGods(){
  const sorted=Object.entries(quizScores).sort((a,b)=>b[1]-a[1]);
  let picked=sorted.slice(0,5).map(s=>s[0]).filter(g=>GOD_INFO[g]);
  while(picked.length<4){const g=GOD_KEYS[Math.floor(Math.random()*GOD_KEYS.length)];if(!picked.includes(g))picked.push(g)}
  deck=picked; deckIdx=0;
  show('view-cards'); renderDeck();
}

/* ================= 浮空卡牌 ================= */
function renderDeck(){
  const box=$('deck-box'); box.innerHTML='';
  for(let i=0;i<Math.min(3,deck.length);i++){
    const g=deck[(deckIdx+i)%deck.length];
    const info=GOD_INFO[g];
    const c=document.createElement('div');
    c.className='gcard'+(i===0?' top':'');
    c.style.zIndex=50-i;
    c.style.transform=`translateY(${i*13}px) scale(${1-i*0.05}) rotate(${i%2?1.5:-1.5}deg)`;
    c.style.borderColor={文明:'var(--civil)',生命:'var(--life)',沉沦:'var(--sink)',混沌:'var(--chaos)',虚无:'var(--void)',存在:'var(--exist)'}[info.path];
    c.innerHTML=`
      <div class="gc-path">【${info.path}】命途</div>
      <div class="gc-name">${g}</div>
      <div class="gc-desc">${info.desc}</div>
      <div class="gc-quote">"${info.quote}"</div>`;
    if(i===0) attachSwipe(c);
    box.appendChild(c);
  }
}
function deckNav(d){
  deckIdx=(deckIdx+d+deck.length)%deck.length;
  renderDeck();
}
function attachSwipe(card){
  let sx=0,dx=0,drag=false;
  const start=x=>{sx=x;drag=true;card.style.animation='none';card.style.transition='none'};
  const move=x=>{if(!drag)return;dx=x-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`};
  const end=()=>{
    if(!drag)return; drag=false; card.style.transition='transform .25s,opacity .25s';
    if(Math.abs(dx)>70){
      const dir=dx>0?1:-1;
      card.style.transform=`translateX(${dir*480}px) rotate(${dir*28}deg)`;
      card.style.opacity=0;
      setTimeout(()=>{deckIdx=(deckIdx+1)%deck.length;renderDeck()},230);
    }else{
      card.style.transform=''; card.style.animation='';
      renderDeck();
    }
    dx=0;
  };
  card.addEventListener('touchstart',e=>start(e.touches[0].clientX));
  card.addEventListener('touchmove',e=>move(e.touches[0].clientX));
  card.addEventListener('touchend',end);
  card.addEventListener('mousedown',e=>{start(e.clientX);const mv=e2=>move(e2.clientX),up=()=>{end();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
}

    <button class="back" style="background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px" onclick="forumShow('forum-list-wrap');curPostId=null">← 返回列表</button>
    <div class="card" style="margin-top:8px">
      <div style="font-size:19px;color:var(--gold2);letter-spacing:1px">${esc(p.title)}</div>
      <div class="dim" style="margin:8px 0 12px">${esc(p.profiles?.name||'无名信徒')} ${p.profiles?.god?('·【'+esc(p.profiles.god)+'】'):''} · ${fmtTime(p.created_at)}</div>
      <div style="line-height:1.8;white-space:pre-wrap">${esc(p.content)}</div>
    </div>
    <div class="sec-t">回 复</div>
    <div id="cmt-list"></div>`;
  renderComments(id);
  forumShow('forum-detail');
}
async function refreshPostDetail(){if(curPostId)openPost(curPostId)}
async function renderComments(postId){
  const {data}=await sb.from('comments').select('id,content,created_at,profiles(name)').eq('post_id',postId).order('created_at',{ascending:true}).limit(100);
  const box=$('cmt-list');if(!box)return;
  box.innerHTML=(data&&data.length)?'':'<div class="dim">暂无回复</div>';
  (data||[]).forEach(c=>{
    const div=document.createElement('div');
    div.className='cmt';
    div.innerHTML=`${esc(c.content)}<div class="cm">${esc(c.profiles?.name||'无名信徒')} · ${fmtTime(c.created_at)}</div>`;
    box.appendChild(div);
  });
}
async function sendCmt(){
  const c=$('cmt-input').value.trim();
  if(!c||!curPostId)return;
  $('cmt-input').value='';
  const {error}=await sb.from('comments').insert({post_id:curPostId,user_id:profile.id,content:c});
  if(!error)addScore(0,1);
}
</script>

/* 天赋位：初始2个，天梯1200/1600/2000/2400各+1（原著） */
function talentSlots(l){return 2+[1200,1600,2000,2400].filter(t=>l>=t).length}
/* 可觉醒等级（原著：分段决定品级） */
function talentGrade(l){return l>=2400?'SS':l>=2000?'S':l>=1600?'A':l>=1200?'B':'C'}
const GRADE_ORDER=['D','C','B','A','S','SS'];
function myTalentPool(){const g=profile.god,j=profile.job;return TALENT_POOL.filter(p=>p[4]===g||p[4]===j||p[4]==='')}
function myFxTalents(){return (profile.talents||[]).filter(t=>TALENT_POOL.some(p=>p[0]===t.k))}
function fxOf(t){const p=TALENT_POOL.find(x=>x[0]===t.k);return p?p[0]:''}

  const cnt={},hostName={};
  (ms||[]).forEach(m=>{cnt[m.room_id]=(cnt[m.room_id]||0)+1});
  rs.forEach(r=>{const h=(ms||[]).find(m=>m.room_id===r.id&&m.user_id===r.host_id);hostName[r.id]=h?h.name:'???'});
  box.innerHTML=rs.map(r=>{

      <div class="tn">#${r.id} 《${esc(t?t.title:r.trial_key)}》 <span class="dim" style="font-size:11px">by ${esc(hostName[r.id]||'')}</span></div>
      <div class="tp">${cnt[r.id]||0}/6 人 ｜ 点此处加入 →</div>
    </div>`;
  }).join('');

async function joinHall(id){
  const {data:r}=await sb.from('rooms').select('*').eq('id',id).eq('status','wait').maybeSingle();
  if(!r){toast('房间不存在或已开始');loadHall();return}
  const {data:cnt}=await sb.from('members').select('id',{count:'exact',head:true}).eq('room_id',id);
  if(cnt>=6){toast('房间已满');return}
  const {error}=await sb.from('members').insert({room_id:id,user_id:profile.id,name:profile.name,god:profile.god,job:profile.job});
  if(error){toast('你已在房间中');}
  enterRoom(id,false);
}

async function joinRoom(){
  const code=Number(($('join-code')||{}).value);
  if(!code){toast('输入房间号');return}
  const {data:r}=await sb.from('rooms').select('*').eq('id',code).eq('status','wait').maybeSingle();
  if(!r){toast('房间不存在或已开始');return}
  const {data:cnt}=await sb.from('members').select('id',{count:'exact',head:true}).eq('room_id',code);
  if(cnt>=6){toast('房间已满');return}
  const {error}=await sb.from('members').insert({room_id:code,user_id:profile.id,name:profile.name,god:profile.god,job:profile.job});
  if(error){toast('你已在房间中');}
  enterRoom(code,false);
}
async function enterRoom(rid,isHost){
  const {data:r}=await sb.from('rooms').select('*').eq('id',rid).single();
  myRoom=r; gPhase=-1; gAnswers=[]; gUsed=[]; gFxThis={};
  renderWaiting(isHost);
  if(myRoomChannel)sb.removeChannel(myRoomChannel);
  myRoomChannel=sb.channel('room-'+rid)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'members',filter:'room_id=eq.'+rid},()=>renderWaiting(isHost))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.'+rid},p=>{myRoom=p.new;p.new.status==='play'?renderGame():p.new.status==='end'?renderResult():renderWaiting(isHost)})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'members',filter:'room_id=eq.'+rid},()=>{if(myRoom.status==='play')renderGameProgress()})
    .subscribe();
}
async function leaveRoom(){
  if(myRoomChannel)sb.removeChannel(myRoomChannel);
  myRoom=null; renderTrials();
}

async function useFx(k){
  const t=MULTI_TRIALS.find(x=>x.key===myRoom.trial_key);
  const q=t.questions[gPhase];
  gFxThis[gPhase]=k; gUsed.push(k);
  const {data:members}=await sb.from('members').select('user_id,god,answers').eq('room_id',myRoom.id);
  const gods=(members||[]).map(m=>m.god);
  const hasGod=g=>gods.includes(g);
  const PEAK={文明:['秩序','战争','真理'],生命:['诞育','繁荣','死亡'],沉沦:['污堕','腐朽','湮灭'],混沌:['混乱','痴愚','沉默'],虚无:['欺诈','命运'],存在:['记忆','时间']};
  const lifeMates=(members||[]).filter(m=>['诞育','繁荣','死亡'].includes(m.god)&&m.user_id!==profile.id).length;
  const hint=(c,txt)=>{$('fx-hint').innerHTML=`<div style="color:${c};font-size:13px;margin:8px 0;line-height:1.6">${txt}</div>`};
  const dimOpt=i=>{const b=$('gq-'+i);if(b)b.style.opacity=.3,b.disabled=true};
  const exclOne=()=>{const w=[0,1,2,3].filter(x=>x!==q.ans);dimOpt(w[Math.floor(Math.random()*w.length)])};
  const showTruth=()=>hint('var(--gold2)','真相在你眼中展开——答案是「'+esc(q.opts[q.ans])+'」。');

  if(k==='lie'){hint('var(--chaos)','"我从不骗人。"——谎言已成真。'+(hasGod('记忆')?'<br>但【记忆】信徒正注视着，冒险加成被记录封存。':''))}
  else if(k==='timefield'){gFxThis.nextPen=(gFxThis.nextPen||0)+5;showTruth();hint('var(--gold2)','真相已窥见。<span style="color:#e74c3c">时间的势能将在下一题向你索取-5分。</span>')}
  else if(k==='master'){exclOne();hint('var(--gold2)','欺骗大师：一个错误选项已被你的谎言否决。答对再+5。')}
  else if(k==='dice'){const d=1+Math.floor(Math.random()*20);const v=d-10;gFxThis.diceV=v;hint('var(--exist)','命运之骰转出了 '+d+' 点（'+(v>=0?'+':'')+v+'分）'+(d===20?'——<b>命运眷顾！本题满分</b>':d===1?'——<b>大失败，本题-10</b>':''))}
  else if(k==='memory'){if(hasGod('欺诈')){exclOne();setTimeout(exclOne,100);hint('var(--gold2)','欺诈就在身边！记忆回溯，<b>两个</b>错误选项被翻出。')}else{exclOne();hint('var(--gold2)','上一次轮回的记忆浮现：排除一个错误选项。')}}

  else if(k==='lust'){const ms=(members||[]).filter(m=>m.user_id!==profile.id&&(m.answers||[])[gPhase]!=null).slice(0,3);

    else if(r<.5){exclOne();hint('var(--chaos)','失律乐章奏响：规则扭曲，一个错误选项消失了。')}
    else if(r<.75){gFxThis.chaosCheat=true;hint('var(--chaos)','失律乐章奏响：对错在你眼中颠倒——本题视为答对。')}
    else{gFxThis.chaosSkip=true;hint('var(--chaos)','失律乐章奏响：你放弃了这道题的答案，保底+5。')}}
  else if(k==='truthsee'){exclOne();setTimeout(exclOne,100);hint('var(--civil)','真理之视：凡人皆愚。两个错误选项无处遁形（冒险奖励-5，因为你太自信了）。')}
  else if(k==='silence'){hint('var(--dim)','沉默领域展开：免答+5分。'+(gFxThis.lastWrong?'上一题的创伤被沉默抚平，再+5。':'')+'（仍需点选任意选项以提交）')}
  else if(k==='heal'){const healed=(members||[]).filter(m=>m.user_id!==profile.id&&(m.answers||[])[gPhase]===q.ans).length;
    hint('var(--life)','共沐神恩：治疗链展开，答对+8，已有 '+healed+' 名队友答对，每人传递+2。')}
  else if(k==='shadow'){const dist=[0,0,0,0];(members||[]).forEach(m=>{const a=(m.answers||[])[gPhase];if(a!=null&&a<4)dist[a]++});
    if(Math.random()<.8)exclOne();
    hint('var(--sink)','阴影穿梭：你遁入暗处窥见——A×'+dist[0]+' B×'+dist[1]+' C×'+dist[2]+' D×'+dist[3]+'。若你是最后作答者，+5。')}
  else if(k==='hunt'){const prey=Math.floor(Math.random()*4);gFxThis.prey=prey;
    hint('var(--chaos)','感官追猎：你的猎物是 <b>'+String.fromCharCode(65+prey)+' 项</b>「'+esc(q.opts[prey])+'」。选中它且它为真，+25分。')}
  else if(k==='overload'){gFxThis.nextPen=(gFxThis.nextPen||0)+8;hint('var(--exist)','过载施法：本题得分×2。<span style="color:#e74c3c">透支的债，下一题-8。</span>')}
  else if(k==='law'){showTruth();gFxThis.lawAns=q.ans;hint('var(--gold2)','律令已宣告：按此作答+20；违背自己的律令，-5。')}
  else if(k==='wall'){hint('var(--civil)','壁垒信仰：答对+12，岿然不动。'+(myRoom.host_id===profile.id?'<br>你是房主，军心+3。':''))}
  else{const ft=(talentFxOf(k)||'').split(':')[0];
    if(ft==='steal'){const dist2=[0,0,0,0];(members||[]).forEach(m=>{const a=(m.answers||[])[gPhase];if(a!=null&&a<4&&m.user_id!==profile.id)dist2[a]++});hint('var(--sink)','你窥见了暗流——A×'+dist2[0]+' B×'+dist2[1]+' C×'+dist2[2]+' D×'+dist2[3]+'。')}
    else if(ft==='peek'){exclOne();hint('var(--gold2)','直觉闪现：一个错误选项被排除。')}

    else if(ft==='noLose'){hint('var(--void)','稳如泰山：本题答错不扣分。')}
    else if(ft==='guard'){hint('var(--gold)','天赋已发动：答对+'+(talentFxOf(k).split(':')[1]||5)+'分。')}
    else if(ft==='healLite'){hint('var(--life)','团队的力量：每名答对的队友+2分。')}
    else hint('var(--gold)','天赋已发动。')}
  if($('fx-row'))$('fx-row').style.display='none';
}
async function answerGQ(oi){
  const t=MULTI_TRIALS.find(x=>x.key===myRoom.trial_key);
  const q=t.questions[gPhase];
  if(gAnswers[gPhase]!=null)return;
  const k=gFxThis[gPhase];
  const {data:members}=await sb.from('members').select('user_id,god,answers').eq('room_id',myRoom.id);
  const gods=(members||[]).map(m=>m.god);
  const hasGod=g=>gods.includes(g);
  const lifeMates=(members||[]).filter(m=>['诞育','繁荣','死亡'].includes(m.god)&&m.user_id!==profile.id).length;
  const matesRight=(members||[]).filter(m=>m.user_id!==profile.id&&(m.answers||[])[gPhase]===q.ans).length;
  const dist=[0,0,0,0];(members||[]).forEach(m=>{const a=(m.answers||[])[gPhase];if(a!=null&&a<4&&m.user_id!==profile.id)dist[a]++});
  const majority=dist.indexOf(Math.max(...dist));
  const answeredByOthers=(members||[]).filter(m=>m.user_id!==profile.id&&(m.answers||[])[gPhase]!=null).length;
  const totalOthers=(members||[]).length-1;

  let pts=0, right=false;
  const _fx=(talentFxOf(k)||'').split(':')[0];
  const _arg=k?(talentFxOf(k).includes(':')?Number(talentFxOf(k).split(':')[1]):0):0;
  if(_fx==='silence'){
    pts=_arg+(k==='silence'&&gFxThis.lastWrong?5:0);
  }else if(k==='chaos'&&gFxThis.chaosSkip){
    pts=5;
  }else{
    right=(k==='lie')||(k==='chaos'&&gFxThis.chaosCheat)||oi===q.ans;
    if(right){
      if(gFxThis.diceV===10){pts=25}
      else{
        pts=(q.risky===oi?20:10);
        if(k==='lie'&&q.risky===oi&&!hasGod('记忆'))pts+=5;
        if(k==='master')pts+=5;
        if(k==='anchor'){pts+=10;if(profile.job==='战士')pts+=5}
        if(k==='birth')pts+=8+lifeMates*3;
        if(k==='wither'){gFxThis.ws=(gFxThis.ws||0);pts+=Math.min(10,gFxThis.ws*2)}
        if(k==='heal')pts+=8+matesRight*2;
        if(k==='lust'&&oi===majority&&dist[majority]>0)pts+=5;
        if(k==='ruin')pts+=30;
        if(k==='shadow'&&answeredByOthers===totalOthers&&totalOthers>0)pts+=5;
        if(k==='hunt'&&gFxThis.prey===oi)pts+=25;
        if(k==='law'&&gFxThis.lawAns===oi)pts+=20;
        if(k==='wall'){pts+=12;if(myRoom.host_id===profile.id)pts+=3}
        if(k==='truthsee'&&q.risky===oi)pts-=5;
        if(_fx==='guard')pts+=_arg;
        if(_fx==='ruin')pts+=_arg;
        if(_fx==='healLite')pts+=matesRight*2;
        if(k==='blood'&&q.risky===oi)pts=(q.risky===oi&&oi===q.ans)?40:-10;
        if(k==='double0')pts*=2;
      }
      if(k==='overload')pts*=2;
      if(k==='dice'&&gFxThis.diceV!=null&&gFxThis.diceV!==10)pts+=gFxThis.diceV;
      if((k==='chaos'||_fx==='chaosS'||_fx==='chaosXS')&&gFxThis.chaosV!=null)pts+=gFxThis.chaosV;
    }else{
      if(k==='dice'&&gFxThis.diceV===-9)pts=-10;
      else if(_fx==='ruin')pts=-(_arg>=18?6:10);
      else if(k==='law'&&gFxThis.lawAns!=null)pts=-5;
      else if(k==='requiem'||k==='calm')pts=0;
      else if(k==='anchor')pts=(q.risky===oi?-2:0);
      else if(k==='rot')pts=0;
      else pts=(q.risky===oi?-5:0);
      if(k==='rot'){pts-=5;if(hasGod('繁荣'))pts-=5}
      if(k==='requiem')gFxThis.nextBonus=(gFxThis.nextBonus||0)+8;
      gFxThis.lastWrong=true;
    }
    if(k==='rot'&&right)pts+=15;
    if(k==='rot'&&!right)pts+=0;
  }
  /* 跨题结算：上题的遗留 */
  if(gFxThis.penApply){pts-=gFxThis.penApply;gFxThis.penApply=0}
  if(gFxThis.bonApply){pts+=gFxThis.bonApply;gFxThis.bonApply=0}
  /* 为下一题布局 */
  if(gFxThis.nextPen){gFxThis.penApply=gFxThis.nextPen;gFxThis.nextPen=0}
  if(gFxThis.nextBonus){gFxThis.bonApply=gFxThis.nextBonus;gFxThis.nextBonus=0}
  if(right&&k==='wither')gFxThis.ws=(gFxThis.ws||0)+1;
  pts=Math.max(0,Math.round(pts));
  gAnswers[gPhase]=oi;
  gFxThis.lastRight=right;
  const {data:me}=await sb.from('members').select('*').eq('room_id',myRoom.id).eq('user_id',profile.id).single();
  const ans=[...(me.answers||[])];ans[gPhase]=oi;
  const used=[...(me.used||[])];if(k)used[gPhase]=k;
  await sb.from('members').update({answers:ans,used:used,score:(me.score||0)+pts}).eq('id',me.id);
  document.querySelectorAll('#trials-body .quiz-opt').forEach((b,bi)=>{b.style.opacity=bi===oi?1:.35;b.onclick=null});
  renderGameProgress(true);
  const {data:all}=await sb.from('members').select('answers').eq('room_id',myRoom.id);
  const done=(all||[]).filter(m=>(m.answers||[])[gPhase]!=null).length;
  if(done===all.length){
    const t2=MULTI_TRIALS.find(x=>x.key===myRoom.trial_key);
    if(gPhase+1<t2.questions.length){
      gFxThis.lastWrong=gFxThis.lastRight===false;
      await sb.from('rooms').update({phase:gPhase+1}).eq('id',myRoom.id);
    }
    else await sb.from('rooms').update({status:'end'}).eq('id',myRoom.id);
  }
}

async function renderResult(){
  const t=MULTI_TRIALS.find(x=>x.key===myRoom.trial_key);
  const {data:ms}=await sb.from('members').select('*').eq('room_id',myRoom.id).order('score',{ascending:false});
  const rank=(ms||[]).findIndex(m=>m.user_id===profile.id);
  const me=ms[rank];
  const {data:myRow}=await sb.from('members').select('answers').eq('room_id',myRoom.id).eq('user_id',profile.id).single();
  const correct=(myRow?.answers||[]).filter((a,i)=>a===t.questions[i].ans).length;
  let lootTxt='';
  if(!me.claimed){
    const {data:meRows}=await sb.from('members').select('answers,used').eq('room_id',myRoom.id).eq('user_id',profile.id).single();
    const total=t.questions.length;
    const grade=correct>=total?'S':(correct>=Math.ceil(total*0.7)?'A':'B');
    let n=rank===0?3:rank===1?2:1;
    if((profile.talents||[]).some(x=>x.k==='wither'))n*=2;
    if((meRows.used||[]).includes('ration'))n+=1;
    await giveItem(t.reward,n);
    const roadGain=correct*2+(grade==='S'?10:grade==='A'?5:2);
    await addScore(roadGain,0);
    let extra='';
    /* 天赋觉醒：概率15%，仅限本信仰/本职业/通用池，品级不超过天梯分段 */
    if(profile.ladder>=1200&&(profile.talents||[]).length<talentSlots(profile.ladder)&&Math.random()<0.08){
      const g=talentGrade(profile.ladder);
      const cand=myTalentPool().filter(p=>GRADE_ORDER.indexOf(p[2])<=GRADE_ORDER.indexOf(g)&&!(profile.talents||[]).some(x=>x.k===p[0]));
      if(cand.length){
        const p=cand[Math.floor(Math.random()*cand.length)];
        const talents=[...(profile.talents||[]),{k:p[0],n:p[1],r:p[2],d:p[3]}];
        profile.talents=talents;
        await sb.from('profiles').update({talents}).eq('id',profile.id);
        extra=`觉醒了${p[2]}级天赋【${p[1]}】！`;
      }
    }
    /* 道具奖励：品质主要由天梯分数决定，其次游戏评分，再是运气 */
    if(!extra){
      const TIER={0:['berry','can','dicecharm','sachet','rustkey','monocle','candy','rope','bread','drink','jerky'],
        1:['bandage','flint','egg','badge','watch','smilemask','photo','seedbag','candle','mirror','score','bell','sword','blankbook'],
        2:['glory','dead','witherrose'],
        3:['diceS'],
        4:['maskSS']};
      const baseTier=profile.ladder>=2400?4:profile.ladder>=2000?3:profile.ladder>=1600?2:profile.ladder>=1200?1:0;
      const gradeFix={S:1,A:0,B:-1}[grade];
      const luck=Math.floor(Math.random()*3)-1;
      const tier=Math.max(0,Math.min(4,baseTier+gradeFix+luck));
      const pick=()=>{const r=Math.random();const lv=r<0.45?tier:(r<0.8?Math.max(0,tier-1):0);const pool=TIER[lv];return pool[Math.floor(Math.random()*pool.length)]};
      const k1=pick();
      await giveItem(k1,1);
      extra=`奖励【${ITEMS[k1][0]}】（天梯${baseTier>=3?'高位':baseTier>=1?'':'偏低'}${gradeFix>0?'，表现优异':gradeFix<0?'，表现欠佳':''}${luck>0?'，运气眷顾':luck<0?'，运气不佳':''}）`;
      if(grade==='S'){const k2=pick();await giveItem(k2,1);extra+=`，【${ITEMS[k2][0]}】`}
    }
    await sb.from('members').update({claimed:1}).eq('room_id',myRoom.id).eq('user_id',profile.id);
    lootTxt=`评价【${grade}】｜食物×${n}，登神之路+${roadGain}<br><span style="font-size:12px" class="dim">奖励品质：天梯分段为主 · 表现为辅 · 运气微调</span><br>${extra}`;
  }
  $('trials-body').innerHTML=`
    <div style="text-align:center;color:var(--gold2);letter-spacing:4px;margin-bottom:10px">✦ 试 炼 结 算 ✦</div>
    <div class="card" style="text-align:center">
      <div style="font-size:22px;color:var(--gold2)">《${esc(t.title)}》</div>
      <div style="margin:10px 0;font-size:17px">你的排名：第 ${rank+1} 位 ｜ ${me.score} 分 ｜ 答对 ${correct}/${t.questions.length}</div>
      <div style="color:var(--gold);margin-bottom:8px">${lootTxt||'奖励已领取'}</div>
    </div>
    <div class="sec-t">队 伍 评 分</div>
    ${ms.map((m,i)=>`<div class="rank-row ${i===0?'first':''} ${m.user_id===profile.id?'mine':''}"><span>第${i+1}位 · ${esc(m.name)}</span><span class="dim">${m.score}分</span></div>`).join('')}
    <button class="btn" onclick="leaveRoom()" style="margin-top:14px">返 回 试 炼 长 廊</button>`;
}

        <div class="tn">《${esc(t.title)}》 <span class="dim" style="font-size:11px">by ${esc(t.author_name)}</span></div>
        <div class="dim" style="font-size:12px;margin:6px 0;line-height:1.6;max-height:80px;overflow:hidden">${esc(t.story)}</div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn sm" onclick="reviewTrial(${t.id},'approved')">通过</button>
          <button class="btn sm blood" onclick="reviewTrial(${t.id},'rejected')">拒绝</button>
        </div>
      </div>`).join('')||'<div class="dim">无</div>');
}
async function reviewTrial(id,status){
  await sb.from('trials_lib').update({status}).eq('id',id);
  toast(status==='approved'?'已通过，全服可见':'已拒绝');
  renderReview();
}

/* ---------- 背包 ---------- *//* ---------- 背包 ---------- *//* ---------- 背包 ---------- */
async function renderBag(){
  const {data:inv}=await sb.from('inventory').select('*').eq('user_id',profile.id);
  const list=(inv||[]).filter(i=>i.count>0);
  $('bag-body').innerHTML=`
    <div style="text-align:center;color:var(--gold2);letter-spacing:4px;margin-bottom:4px">✦ 随 身 空 间 ✦</div>
    <div class="dim" style="text-align:center;margin-bottom:16px">保险立柜大小的随身空间，存放最重要的东西</div>
    ${list.length?list.map(i=>{
      const it=ITEMS[i.item_key]||[i.item_key,'?',''];
      return `<div class="item-row">
        <span style="flex:1"><b>${esc(it[0])}</b> <span class="rank ${it[1]==='S'||it[1]==='SS'?'ss':''}" style="float:none">${it[1]}</span> <span class="dim">×${i.count}</span><br>
        <span class="dim" style="font-size:12px;line-height:1.5">${esc(it[2])}</span></span>
        <button class="btn sm" style="flex:none" onclick="useItem('${i.item_key}')">使用</button>
      </div>`;
    }).join(''):'<div class="dim" style="text-align:center;padding:30px 0">空空如也</div>'}`;
}
async function useItem(key){
  const {data:inv}=await sb.from('inventory').select('*').eq('user_id',profile.id).eq('item_key',key).maybeSingle();
  if(!inv||inv.count<1)return;
  if(inv.count<=1)await sb.from('inventory').delete().eq('id',inv.id);
  else await sb.from('inventory').update({count:inv.count-1}).eq('id',inv.id);
  const g=ITEMS[key][3]||[1,5];
  const gain=g[0]+Math.floor(Math.random()*(g[1]-g[0]+1));
  addScore(gain,0);
  toast(`使用了【${ITEMS[key][0]}】，登神之路+${gain}`);
  renderBag();
}
async function giveItem(key,count){
  const {data:ex}=await sb.from('inventory').select('*').eq('user_id',profile.id).eq('item_key',key).maybeSingle();
  if(ex)await sb.from('inventory').update({count:ex.count+count}).eq('id',ex.id);
  else await sb.from('inventory').insert({user_id:profile.id,item_key:key,count});
}

/* ---------- 面板（含双排行榜） ---------- */
function renderPanel(){
  const p=profile, g=GOD_INFO[p.god]||{desc:''}, jt=JOBS[p.job]?.talent||['','?',''];
  const talents=p.talents||[], skills=p.skills||[];
  const slots=talentSlots(p.ladder);
  const unlockAt=['初始','初始','天梯1200','天梯1600','天梯2000','天梯2400'];
  let slotsHtml='';
  for(let i=0;i<slots;i++){
    const t=talents[i];
    slotsHtml+=t?`<div class="talent"><span class="rank ${t.r==='SS'?'ss':''}">${t.r}</span>
        <div class="tt">${esc(t.n)}</div><div class="td">${esc(t.d)}<span style="color:var(--exist)">　｜试炼中可发动</span></div></div>`
      :`<div class="talent" style="opacity:.45;border-style:dashed"><div class="tt dim">◇ 空 天 赋 位</div>
        <div class="td">${i<2?'初始天赋位，于个人/多人试炼中觉醒':'需'+unlockAt[i]+'后解锁'}</div></div>`;
  }
  $('panel-body').innerHTML=`
    <div class="p-name">${esc(p.name)}</div>
    <div class="p-tags"><span class="tag">${esc(p.path)}</span>
      <span class="tag" style="color:var(--gold);border-color:var(--gold)">${esc(p.god)}</span>
      <span class="tag">${esc(p.job)}</span></div>
    <div class="score-grid">
      <div class="score-card"><div class="dim">登神之路</div><div class="n">${p.ladder}</div>
        <div class="dim" style="font-size:11px">低于1000分，死亡</div>
        <div class="bar"><i style="width:${Math.min(100,p.ladder/24)}%"></i></div></div>
      <div class="score-card"><div class="dim">觐见之梯</div><div class="n">${p.divine_road}</div>
        <div class="bar"><i style="width:${Math.min(100,p.divine_road/2)}%"></i></div></div>
    </div>
    <div class="sec-t">登 神 之 路 · 天 梯 榜</div>
    <div class="card" style="padding:10px 12px" id="rank-ladder"><div class="dim">加载中……</div></div>
    <div class="sec-t">觐 见 之 梯（本信仰与对立信仰）</div>
    <div class="dim" style="margin:-6px 0 8px 2px;font-size:12px">你只能看到【${esc(p.god)}】与【${esc(ENEMY[p.god]||'')}】信徒的排名</div>
    <div class="card" style="padding:10px 12px" id="rank-road"><div class="dim">加载中……</div></div>
    <div class="sec-t">天 赋（${talents.length} / ${slots} 位 · 可觉醒等级 ${talentGrade(p.ladder)}）</div>
    <div class="dim" style="margin:-6px 0 8px 2px;font-size:12px">天赋位于天梯 1200 / 1600 / 2000 / 2400 分段解锁更多空位，觉醒品级随分段提升</div>
    ${slotsHtml||'<div class="card dim" style="text-align:center;padding:14px">无空位</div>'}
    <div class="sec-t">职 业 初 始 天 赋（未觉醒）</div>
    <div class="talent" style="opacity:.6"><div class="tt">【${esc(p.job)}】${jt[0]}</div>
      <div class="td">${jt[2]}<br><span style="color:#c0392b">初始天赋，尚未觉醒</span></div></div>
    <div class="sec-t">技 能</div>
    ${skills.length?`<div class="card" style="padding:12px"><div class="skill-chips">${skills.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div>`
      :'<div class="card dim" style="text-align:center;padding:18px">尚未获得技能<br><span style="font-size:12px">通过试炼领悟</span></div>'}`;
  loadLadder(); loadRoad();
}
async function loadLadder(){
  const {data}=await sb.from('profiles').select('id,name,god,job,ladder').order('ladder',{ascending:false}).limit(20);
  const box=$('rank-ladder');if(!box)return;
  box.innerHTML=(data&&data.length)?data.map((r,i)=>`
    <div class="rank-row ${i===0?'first':''} ${r.id===profile.id?'mine':''}">
      <span>第${i+1}位 · ${esc(r.name)}</span>
      <span class="dim" style="font-size:12px">${esc(r.god)}·${esc(r.job)} ｜ ${r.ladder}分</span>
    </div>`).join(''):'<div class="dim" style="text-align:center;padding:14px">虚位以待</div>';
}
async function loadRoad(){
  const gods=[profile.god,ENEMY[profile.god]].filter(Boolean);
  const {data}=await sb.from('profiles').select('id,name,god,job,divine_road').in('god',gods).order('divine_road',{ascending:false}).limit(20);
  const box=$('rank-road');if(!box)return;
  box.innerHTML=(data&&data.length)?data.map((r,i)=>`
    <div class="rank-row ${i===0?'first':''} ${r.id===profile.id?'mine':''}">
      <span>第${i+1}位 · ${esc(r.name)} <span class="dim" style="font-size:11px">【${esc(r.god)}】</span></span>
      <span class="dim" style="font-size:12px">${r.divine_road}分</span>
    </div>`).join(''):'<div class="dim" style="text-align:center;padding:14px">虚位以待</div>';
}

/* ---------- 我的 ---------- *//* ---------- 我的 ---------- */
function renderMe(){
  $('me-body').innerHTML=`
    <div class="card" style="text-align:center;padding:22px 16px">
      <div style="font-size:24px;color:var(--gold2);letter-spacing:3px">${esc(profile.name)}</div>
      <div class="dim" style="margin-top:6px">【${esc(profile.path)}·${esc(profile.god)}】 ${esc(profile.job)}</div>
    </div>
    <div class="me-row"><span>修改名字</span><button onclick="rename()">修改</button></div>
    <button class="btn blood" onclick="doLogout()" style="margin-top:20px">退出登录</button>
    <div class="dim" style="text-align:center;margin-top:16px">诸神愚戏 · 信仰游戏</div>`;
}
async function rename(){
  const n=prompt('输入新的名字（12字以内）',profile.name);
  if(!n||!n.trim())return;
  const {error}=await sb.from('profiles').update({name:n.trim().slice(0,12)}).eq('id',profile.id);
  if(error){toast(error.message);return}
  profile.name=n.trim().slice(0,12);
  $('h-name').textContent=profile.name;
  renderMe(); toast('名字已更改');
}
async function doLogout(){await sb.auth.signOut();location.reload()}

/* ---------- 好友 / 私聊 ---------- */
let dmFriend=null;
async function renderFriends(){
  $('friends-main').style.display='block';
  $('dm-pane').style.display='none';
  const {data:reqs}=await sb.from('friend_requests').select('*,profiles!friend_requests_from_id_fkey(name,god,job)').eq('to_id',profile.id).eq('status','pending');
  const {data:fl}=await sb.from('friends').select('friend_id').eq('user_id',profile.id);
  const ids=(fl||[]).map(f=>f.friend_id);
  let fdata=[];
  if(ids.length){
    const r=await sb.from('profiles').select('id,name,god,job').in('id',ids);
    fdata=r.data||[];
  }
  $('friends-body').innerHTML=`
    <div style="text-align:center;color:var(--gold2);letter-spacing:4px;margin-bottom:14px">✦ 信 徒 结 识 ✦</div>
    <div class="card">
      <div style="display:flex;gap:8px">
        <input id="fsearch" placeholder="搜索信徒名称……" onkeydown="if(event.key==='Enter')searchPlayer()">
        <button class="btn sm" style="flex:none" onclick="searchPlayer()">搜索</button>
      </div>
      <div id="search-result"></div>
    </div>
    ${(reqs&&reqs.length)?`<div class="sec-t">好 友 申 请</div>`+reqs.map(r=>`
      <div class="me-row"><span>${esc(r.profiles?.name||'未知')} <span class="dim" style="font-size:12px">${esc(r.profiles?.god||'')}·${esc(r.profiles?.job||'')}</span></span>
      <span style="display:flex;gap:6px">
        <button onclick="acceptReq(${r.id},'${r.from_id}')">接受</button>
        <button onclick="rejectReq(${r.id})" style="border-color:rgba(192,57,43,.6);color:#e74c3c">拒绝</button>
      </span></div>`).join(''):''}
    <div class="sec-t">我 的 好 友（${fdata.length}）</div>
    ${fdata.length?fdata.map(f=>`
      <div class="me-row" style="cursor:pointer" onclick="openDM('${f.id}','${esc(f.name)}')">
        <span>${esc(f.name)} <span class="dim" style="font-size:12px">${esc(f.god)}·${esc(f.job)}</span></span>
        <span style="display:flex;gap:6px">
          <button onclick="event.stopPropagation();inviteTrial('${f.id}','${esc(f.name)}')">邀TA试炼</button>
          <button onclick="event.stopPropagation();openDM('${f.id}','${esc(f.name)}')">私聊</button>
        </span>
      </div>`).join('')
      :'<div class="card dim" style="text-align:center;padding:20px">还没有好友，搜索名称添加吧</div>'}`;
}
async function searchPlayer(){
  const n=$('fsearch').value.trim();
  if(!n)return;
  const {data}=await sb.from('profiles').select('id,name,god,job').ilike('name','%'+n+'%').limit(10);
  const {data:fl}=await sb.from('friends').select('friend_id').eq('user_id',profile.id);
  const fids=new Set((fl||[]).map(f=>f.friend_id));
  const {data:sent}=await sb.from('friend_requests').select('to_id').eq('from_id',profile.id).eq('status','pending');
  const sids=new Set((sent||[]).map(s=>s.to_id));
  const list=(data||[]).filter(p=>p.id!==profile.id);
  $('search-result').innerHTML=list.length?list.map(p=>`
    <div class="me-row" style="margin-top:8px;margin-bottom:0">
      <span>${esc(p.name)} <span class="dim" style="font-size:12px">${esc(p.god)}·${esc(p.job)}</span></span>
      ${fids.has(p.id)?'<span class="dim">已是好友</span>'
        :sids.has(p.id)?'<span class="dim">已申请</span>'
        :`<button onclick="sendFriendReq('${p.id}')">加好友</button>`}
    </div>`).join('')
    :'<div class="dim" style="margin-top:10px">没有找到该名称的信徒</div>';
}
async function sendFriendReq(to){
  const {error}=await sb.from('friend_requests').insert({from_id:profile.id,to_id:to});
  if(error){toast('已申请过或对方已申请你');return}
  toast('好友申请已发送');
  searchPlayer();
}
async function acceptReq(id,from){
  await sb.from('friend_requests').update({status:'accepted'}).eq('id',id);
  await sb.from('friends').insert([{user_id:profile.id,friend_id:from},{user_id:from,friend_id:profile.id}]);
  toast('已成为好友');
  renderFriends();
}
async function rejectReq(id){
  await sb.from('friend_requests').update({status:'rejected'}).eq('id',id);
  renderFriends();
}
async function openDM(fid,fname){
  dmFriend={id:fid,name:fname};
  $('friends-main').style.display='none';
  $('dm-pane').style.display='flex';
  $('dm-head').innerHTML=`
    <button style="background:none;border:none;color:var(--dim);font-family:inherit;font-size:16px" onclick="renderFriends()">←</button>
    <div style="flex:1">
      <div style="color:var(--gold2);font-size:16px">${esc(fname)}</div>
      <div class="dim" style="font-size:11px">私密频道，无人旁观</div>
    </div>
    <button style="background:none;border:1px solid rgba(212,175,55,.4);color:var(--gold);border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px" onclick="inviteTrial('${fid}','${esc(fname)}')">邀TA试炼</button>`;
  await loadDMs();
}
async function loadDMs(){
  const {data}=await sb.from('dms').select('*')
    .or(`and(from_id.eq.${profile.id},to_id.eq.${dmFriend.id}),and(from_id.eq.${dmFriend.id},to_id.eq.${profile.id})`)
    .order('created_at',{ascending:false}).limit(60);
  $('dm-list').innerHTML='';
  (data||[]).reverse().forEach(m=>appendDM(m));
}
function appendDM(m){
  const mine=m.from_id===profile.id;
  const div=document.createElement('div');
  div.className='msg'+(mine?' me':'');
  const body=m.kind==='invite'
    ?`<div class="bub" style="border-color:rgba(155,89,182,.6)">⚔ ${esc(m.content)}</div>`
    :`<div class="bub">${esc(m.content)}</div>`;
  div.innerHTML=`<div class="who">${mine?'我':esc(dmFriend?.name||'')}</div>${body}<div class="time">${fmtTime(m.created_at)}</div>`;
  const list=$('dm-list');
  list.appendChild(div);
  list.scrollTop=list.scrollHeight;
}
async function sendDM(){
  const c=$('dm-input').value.trim();
  if(!c||!dmFriend)return;
  $('dm-input').value='';
  const {error}=await sb.from('dms').insert({from_id:profile.id,to_id:dmFriend.id,content:c});
  if(error)toast(error.message);
}
async function inviteTrial(fid,fname){
  const {data:done}=await sb.from('trials_done').select('trial_key').eq('user_id',profile.id);
  const doneKeys=new Set((done||[]).map(d=>d.trial_key));
  const avail=OFFICIAL_TRIALS.filter(t=>!doneKeys.has(t.key));
  if(!avail.length){toast('你已通关全部官方试炼');return}
  const t=avail[Math.floor(Math.random()*avail.length)];
  const {error}=await sb.from('dms').insert({from_id:profile.id,to_id:fid,content:`${profile.name} 邀请你挑战个人试炼《${t.title}》，去试炼页寻找它吧`,kind:'invite'});
  if(error){toast(error.message);return}
  toast(`已向 ${fname} 发出试炼邀请`);
}

/* ---------- 计分 ---------- */
async function addScore(road,ladder){
  profile.ladder=(profile.ladder??1000)+road;
  profile.divine_road=(profile.divine_road??0)+ladder;
  await sb.from('profiles').update({ladder:profile.ladder,divine_road:profile.divine_road}).eq('id',profile.id);
}

boot();
</script>
</body>
</html>
